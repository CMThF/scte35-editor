[package]
name = "scte35-editor"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scte35 = { version = "0.2", features = ["base64"] }

[dependencies.crossterm]
version = "0.28"

[dependencies.ratatui]
version = "0.29"

[dependencies.ratatui-toolkit]
version = "0.1.16"
default-features = false
features = ["full"]

[dev-dependencies]
ureq = "2.12"
