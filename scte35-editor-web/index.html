<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>scte35-editor (WASM)</title>
    <style>
      :root {
        --bg: #f7f3ef;
        --ink: #1c1c1c;
        --accent: #1b7f6b;
        --panel: #ffffff;
        --border: #d6cfc7;
        --muted: #5d5d5d;
        --error: #b91c1c;
        --error-soft: rgba(185, 28, 28, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Fira Sans", "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      .app {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }
      .app__header {
        padding: 24px 32px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(120deg, #fff7ef, #f2f7f4);
        display: grid;
        gap: 8px;
      }
      .app__header h1 {
        margin: 0 0 6px;
        font-size: 26px;
      }
      .app__header p {
        margin: 0;
        color: var(--muted);
      }
      .app__main {
        display: grid;
        grid-template-columns: 1.1fr 1fr 1fr;
        gap: 16px;
        padding: 24px 32px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
        min-height: 220px;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.05);
      }
      .tree {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .tree__item {
        text-align: left;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #fffdfb;
        color: var(--ink);
        font-weight: 500;
      }
      .tree__item--selected {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(27, 127, 107, 0.1);
      }
      .tree__item--error {
        border-color: var(--error);
        animation: error-flash 0.8s ease-in-out 2;
      }
      .panel h2 {
        margin: 0 0 10px;
        font-size: 16px;
        color: var(--accent);
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 13px;
        width: fit-content;
        border: 1px solid var(--border);
        background: #f6f1eb;
      }
      .status--ok {
        color: var(--accent);
      }
      .status--error {
        color: var(--error);
        border-color: rgba(185, 28, 28, 0.35);
        background: var(--error-soft);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 12px;
        font-size: 14px;
        color: var(--muted);
      }
      .controls label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
        font-family: "IBM Plex Mono", "Fira Code", monospace;
        font-size: 13px;
        background: #fbf7f2;
        color: var(--ink);
      }
      .input--error {
        border-color: var(--error);
        box-shadow: 0 0 0 2px rgba(185, 28, 28, 0.12);
        animation: error-flash 0.8s ease-in-out 2;
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 12px;
      }
      .editor {
        margin-top: 16px;
        display: grid;
        gap: 10px;
      }
      .editor label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
      }
      .meta {
        display: grid;
        gap: 4px;
        font-size: 12px;
        color: var(--muted);
      }
      button {
        border: none;
        border-radius: 999px;
        padding: 8px 14px;
        background: var(--accent);
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.9;
      }
      pre {
        margin: 0;
        padding: 12px;
        background: #f6f1eb;
        border-radius: 8px;
        overflow: auto;
      }
      .app__footer {
        padding: 12px 32px;
        border-top: 1px solid var(--border);
        color: var(--muted);
      }
      .status--flash {
        animation: error-flash 0.8s ease-in-out 2;
      }
      @keyframes error-flash {
        0% { background: var(--error-soft); }
        50% { background: rgba(185, 28, 28, 0.35); }
        100% { background: var(--error-soft); }
      }
      @media (max-width: 1100px) {
        .app__main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
